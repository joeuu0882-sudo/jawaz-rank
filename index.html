:root{--bg:#0B2530;--pn:#123A4A;--ln:#25576B;--tx:#E8F1F2;--mu:#9DB8C0;--free:#2FA36B;--voa:#E9B949;--eta:#6CC3D5;--ev:#4C9BD6;--req:#C8553D;--ban:#6B2433;--map:#0A1F29;box-sizing:border-box}
html{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo',Tahoma,sans-serif;line-height:1.6}
.w{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:clamp(28px,6vw,46px);font-weight:900;margin:6px 0 4px}
.sub{color:var(--mu);margin:0 0 16px}
input,select,button{font:inherit;color:inherit}
input,select{background:var(--pn);border:1.5px solid var(--ln);border-radius:10px;padding:7px 12px}
.btn{background:var(--pn);border:1.5px solid var(--ln);border-radius:10px;padding:6px 14px;cursor:pointer;text-decoration:none;display:inline-block}
.btn[aria-pressed=true]{background:var(--tx);color:var(--bg);font-weight:700}
:focus-visible{outline:3px solid var(--voa);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.fc{background:var(--pn);border:1.5px solid var(--ln);border-radius:12px;padding:12px 8px;text-align:center;color:inherit;text-decoration:none;transition:transform .15s,border-color .15s}
.fc:hover,.fc:focus-visible{transform:translateY(-3px);border-color:var(--tx)}
.fc img,.fc .em{width:64px;height:44px;object-fit:cover;border-radius:5px;display:block;margin:0 auto 6px;font-size:36px;line-height:44px}
.fc b{display:block;font-size:14px;line-height:1.3}
.fc small{color:var(--mu)}
.fl{width:72px;height:50px;object-fit:cover;border-radius:6px}
.hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:10px 0}
.big{font-size:clamp(60px,14vw,110px);font-weight:900;line-height:.9;font-variant-numeric:tabular-nums}
.hl{color:var(--mu)}.hl b{color:var(--tx)}
.mapbox{background:var(--map);border-radius:14px;overflow:hidden;direction:ltr;touch-action:none;cursor:grab}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox path{stroke:var(--map);stroke-width:.6;vector-effect:non-scaling-stroke;transition:fill .35s,opacity .3s}
.mapbox path:hover{stroke:var(--tx);stroke-width:1.5}
.sel{stroke:var(--tx)!important;stroke-width:2!important}
.dim path:not(.on){opacity:.15}
.msg{padding:50px 20px;text-align:center;color:var(--mu);direction:rtl}
.info{min-height:3.4em;margin:12px 0;padding:10px 14px;background:var(--pn);border-radius:10px;color:var(--mu)}
.info b{color:var(--tx)}
.leg{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.lg{display:flex;align-items:center;gap:8px;background:var(--pn);border:1.5px solid var(--ln);border-radius:10px;padding:5px 12px;cursor:pointer}
.lg[aria-pressed=true]{border-color:var(--tx)}
.dot{width:14px;height:14px;border-radius:4px}
h2{font-size:21px;margin:26px 0 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;background:var(--pn);border:2px solid var(--ln);border-radius:8px;padding:3px 10px;cursor:pointer;font-size:14px}
.chip img{width:22px;height:15px;object-fit:cover;border-radius:2px}
.diff{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.diff div{background:var(--pn);border-radius:12px;padding:12px 16px}
.diff p{margin:4px 0 0;color:var(--mu);font-size:14px}
.card{max-width:420px;border-radius:18px;padding:22px;background:linear-gradient(155deg,#16505F,#0E2F3C);border:2px dashed var(--mu);position:relative}
.card .st{position:absolute;left:16px;top:16px;border:3px solid var(--req);color:var(--req);border-radius:8px;padding:2px 10px;font-weight:900;transform:rotate(-9deg)}
.card .n{font-size:20px;font-weight:700}.card .v{font-size:60px;font-weight:900;line-height:1.1}
.card small{color:var(--mu)}
.cb{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:10px 0}
.go{margin-top:12px;background:var(--tx);color:var(--bg);border:0;border-radius:10px;padding:8px 18px;font-weight:700;cursor:pointer}
.note{color:var(--mu);font-size:13px;margin-top:30px;border-top:1px solid var(--ln);padding-top:12px}
.brand{margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand select{max-width:170px}.brand a{display:inline-flex;align-items:center;gap:12px;color:inherit;text-decoration:none}.brand .logo{width:38px;height:auto;flex:none}.brand b{display:block;font-size:24px;font-weight:900;line-height:1.1}.brand small{display:block;color:var(--free);font-weight:700;letter-spacing:3px;font-size:12px}
[hidden]{display:none!important}
#splash{position:fixed;inset:0;z-index:9999;background:#0B2530;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:opacity .6s;cursor:pointer}
#splash.out{opacity:0;pointer-events:none}
#splash svg{width:min(78vw,340px);height:auto;overflow:visible}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .9s cubic-bezier(.2,1.3,.4,1) both}
.trail{stroke-dasharray:430;stroke-dashoffset:430;animation:draw 1.8s .5s cubic-bezier(.4,0,.2,1) forwards}
.plane{opacity:0;animation:appear .2s .5s forwards}
.stamp{transform-box:fill-box;transform-origin:center;opacity:0;animation:stamp .45s 2.1s cubic-bezier(.2,1.2,.4,1) forwards}
.spn{opacity:0;transform:translateY(10px);animation:up .6s 2.3s forwards;text-align:center}
.spn b{display:block;font-size:34px;font-weight:900;line-height:1.2}.spn small{color:#2FA36B;letter-spacing:6px;font-weight:700}
#spskip{position:absolute;bottom:24px;background:none;border:1.5px solid #25576B;border-radius:999px;color:#9DB8C0;padding:4px 18px;cursor:pointer}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes appear{to{opacity:1}}
@keyframes up{to{opacity:1;transform:none}}
@keyframes stamp{0%{transform:scale(2.6) rotate(-14deg);opacity:0}70%{transform:scale(.92) rotate(-14deg);opacity:1}100%{transform:scale(1) rotate(-14deg);opacity:1}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}.plane{display:none}}
html{-webkit-text-size-adjust:100%}
.w{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(48px,env(safe-area-inset-bottom))}
input,select{font-size:16px}
.mapbox{-webkit-tap-highlight-color:transparent;touch-action:pan-y}
.info{position:sticky;bottom:max(10px,env(safe-area-inset-bottom));z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.45)}
@media (max-width:600px){
.grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.fc{padding:10px 6px}.fc b{font-size:13px}
.brand{flex-wrap:wrap}.brand select{max-width:100%;flex:1 1 140px}
.hero{gap:10px}
.bar{gap:6px}.bar input{min-width:0;flex:1 1 100%}
.btn,.lg,.go{min-height:44px}
.btn{padding:8px 14px}
h2{font-size:19px}
.card{max-width:100%}
.diff{grid-template-columns:1fr}
#psv{height:220px!important}
.mapbox{border-radius:10px}
}
